name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          mkdir -p CameraLock/app/src/main/java/com/example/cameralock CameraLock/app/src/main/res/xml CameraLock/app/src/main/res/values
          cat > CameraLock/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CameraLock"
          include ':app'
          EOF
          cat > CameraLock/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF
          cat > CameraLock/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          cat > CameraLock/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.cameralock'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.cameralock'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > CameraLock/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".AdminReceiver"
                      android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF
          cat > CameraLock/app/src/main/res/xml/device_admin.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <disable-camera />
              </uses-policies>
          </device-admin>
          EOF
          cat > CameraLock/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Camera Lock</string>
          </resources>
          EOF
          cat > CameraLock/app/src/main/java/com/example/cameralock/AdminReceiver.java <<'EOF'
          package com.example.cameralock;

          import android.app.admin.DeviceAdminReceiver;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;

          public class AdminReceiver extends DeviceAdminReceiver {

              // Admin permission দেওয়ার সাথে সাথেই সব ক্যামেরা বন্ধ করে দেয়
              @Override
              public void onEnabled(Context context, Intent intent) {
                  DevicePolicyManager dpm =
                          (DevicePolicyManager) context.getSystemService(Context.DEVICE_POLICY_SERVICE);
                  ComponentName admin = new ComponentName(context, AdminReceiver.class);
                  dpm.setCameraDisabled(admin, true);
              }
          }
          EOF
          cat > CameraLock/app/src/main/java/com/example/cameralock/MainActivity.java <<'EOF'
          package com.example.cameralock;

          import android.app.Activity;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private static final int REQ_ADMIN = 1;

              private DevicePolicyManager dpm;
              private ComponentName admin;
              private TextView status;
              private Button button;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  dpm = (DevicePolicyManager) getSystemService(DEVICE_POLICY_SERVICE);
                  admin = new ComponentName(this, AdminReceiver.class);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  int pad = (int) (24 * getResources().getDisplayMetrics().density);
                  root.setPadding(pad, pad, pad, pad);

                  status = new TextView(this);
                  status.setTextSize(20);
                  status.setTypeface(Typeface.DEFAULT_BOLD);
                  status.setGravity(Gravity.CENTER);

                  button = new Button(this);
                  button.setOnClickListener(v -> onButtonClick());

                  root.addView(status);
                  root.addView(button);
                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
              }

              private void onButtonClick() {
                  if (!dpm.isAdminActive(admin)) {
                      Intent intent = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                      intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, admin);
                      intent.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION,
                              "ফোনের সামনের ও পেছনের ক্যামেরা বন্ধ রাখতে এই অনুমতি দরকার।");
                      startActivityForResult(intent, REQ_ADMIN);
                  } else {
                      boolean disabled = dpm.getCameraDisabled(admin);
                      dpm.setCameraDisabled(admin, !disabled);
                      refresh();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  refresh();
              }

              private void refresh() {
                  if (!dpm.isAdminActive(admin)) {
                      status.setText("অনুমতি দেওয়া হয়নি");
                      button.setText("ক্যামেরা বন্ধ করার অনুমতি দিন");
                  } else if (dpm.getCameraDisabled(admin)) {
                      status.setText("ক্যামেরা বন্ধ আছে 🔒");
                      button.setText("ক্যামেরা চালু করুন");
                  } else {
                      status.setText("ক্যামেরা চালু আছে");
                      button.setText("ক্যামেরা বন্ধ করুন");
                  }
              }
          }
          EOF

      - name: Build debug APK
        working-directory: CameraLock
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CameraLock-apk
          path: CameraLock/app/build/outputs/apk/debug/app-debug.apk
